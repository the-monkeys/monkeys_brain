swagger: '2.0'
info:
  title: The Monkeys
  version: 0.0.1
tags:
  - name: Authentication
  - name: Verification
    description: >
      Blue-check identity verification: private-bucket document uploads,
      submission, tracking and reviewer access URLs.
consumes:
  - application/json
produces:
  - application/json
paths:
  /v1/user/search:
    get:
      tags:
        - Search
      summary: "[DEPRECATED] People search (legacy)"
      description: >
        DEPRECATED — Phase 5 of Search v2 deprecation.

        This route now returns 308 Permanent Redirect to
        `/api/v2/user/search` with the original query string preserved
        (`search_term`, `limit`, `offset` are identical between v1 and
        v2). Scheduled for removal one release after the v2 path is
        steady.
      deprecated: true
      operationId: UserService.searchLegacy
      parameters:
        - name: search_term
          in: query
          required: true
          type: string
      responses:
        '308':
          description: Permanent Redirect to `/api/v2/user/search`.

  /v2/user/search:
    get:
      tags:
        - Search
      summary: People search (v2 — ranked, Active-only)
      description: >
        Postgres `pg_trgm`-backed people search. Ranks exact-username
        matches first, then prefix matches, then trigram similarity
        across username, first/last name and bio. Only `Active` users
        are returned. Rate limited to 100 req/s per client. Response is
        cached at the gateway for 30 s.
      operationId: UserService.searchV2
      parameters:
        - name: search_term
          in: query
          required: true
          type: string
          minLength: 1
          maxLength: 128
        - name: limit
          in: query
          required: false
          type: integer
          default: 10
          maximum: 50
        - name: offset
          in: query
          required: false
          type: integer
          default: 0
      responses:
        '200':
          description: Successful operation.
          schema:
            type: object
            properties:
              users:
                type: array
                items:
                  type: object
                  properties:
                    account_id: { type: string }
                    username: { type: string }
                    first_name: { type: string }
                    last_name: { type: string }
                    bio: { type: string }
                    avatar_url: { type: string }
              limit: { type: integer }
              offset: { type: integer }
        '400':
          description: Invalid input (`search_term` missing or out of range, `limit` over cap).
        '429':
          description: Rate limit exceeded.

  /user/:username:
    get:
      operationId: UserService.getProfile
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              account_id:
                type: string
                example: nnJ2zlT0RDJB
              username:
                type: string
                example: example
              first_name:
                type: string
                example: example
              last_name:
                type: string
                example: "2006-01-02 00:00:00 +0000 +0000"
              bio:
                type: string
                example: "Student of Science, learning, un-learning, relearning"
              date_of_birth:
                type: string
                example: "https://example.com/avatar/profile.jpg"
              created_at:
                type: string
                example: example
              updated_at:
                type: string
                example: +9876543210
              user_status:
                type: string
                example: active
              instagram:
                type: string
                example: example
              linkedin:
                type: string
                example: example
              twitter:
                type: string
                example: example
              github:
                type: string
                example: example
        default:
          description: An unexpected error response.
          schema: {}
      parameters:
        - in: header
          name: Authorization
          type: string
          required: true
          description: Bearer token for authorization
        - in: header
          name: ip
          type: string
          required: true
          description: Ip address of the user
        - in: header
          name: client
          type: string
          required: true
          description: Ip address of the user
      tags:
        - User
        
    put:
      operationId: UserService.UpdateProfile
      responses:
        '202':
          description: A successful response.
          schema:
            type: object
            properties:
              username:
                type: string
                example: nnJ2zlT0RDJB
              first_name:
                type: string
                example: example
              last_name:
                type: string
                example: example
              date_of_birth:
                type: string
                example: "2006-01-02 00:00:00 +0000 +0000"
              bio:
                type: string
                example: "Student of Science, learning, un-learning, relearning"
              avatar_url:
                type: string
                example: "https://example.com/avatar/profile.jpg"
              address:
                type: string
                example: example
              contact_number:
                type: string
                example: +9876543210
              user_status:
                type: string
                example: active
        default:
          description: An unexpected error response.
          schema: {}
      parameters:
        - in: header
          name: Authorization
          type: string
          required: true
          description: Description for Header1
        - in: header
          name: email
          type: string
          required: true
          description: Description for Header2
              
      tags:
        - User

    patch:
      operationId: UserService.updateProfile
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              username:
                type: string
                example: zB2zfb0zPL0t
        default:
          description: An unexpected error response.
          schema: {}
      parameters:
        - in: header
          name: Authorization
          type: string
          required: true
          description: Bearer token for authorization
        - in: header
          name: email
          type: string
          required: true
          description: User's email
        - in: body
          name: body
          required: true
          schema:
            type: object
            properties:
              first_name:
                type: string
                example: First
              last_name:
                type: string
                example: Last
              date_of_birth:
                type: string
                example: "2001-01-26"
              bio:
                type: string
                example: Full Name, an American fashion designer, was born on February 12, 1964, in Detroit, Michigan.
              address:
                type: string
                example: Detroit, Michigan
              contact_number:
                type: string
                example: 0987654321
              twitter:
                type: string
                example: username
              instagram:
                type: string
                example: username
              linkedin:
                type: string
                example: username
              github:
                type: string
                example: username
      tags:
        - User
    delete:
      operationId: UserService.deleteProfile
      responses:
        '200':
          description: A successful response.
        default:
          description: An unexpected error response.
          schema: {}
      parameters:
        - in: header
          name: Authorization
          type: string
          required: true
          description: Bearer token for authorization
        - in: header
          name: ip
          type: string
          required: true
          description: Ip address of the user
        - in: header
          name: client
          type: string
          required: true
          description: Ip address of the user
      tags:
        - User
      
  /user/topics:
    get:
      operationId: UserService.getTopics
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              topics:
                type: array
                items:
                  type: object
                  properties:
                    topic:
                      type: string
                      example: Reading
                    category:
                      type: string
                      example: Hobbies
        default:
          description: An unexpected error response.
          schema: {}
      tags:
        - Topics
        
  /user/categories:
    get:
      summary: List all categories
      description: Retrieves a list of all top-level categories in the knowledge base.
      responses:
        '200':
          description: A successful response.
          schema:
            type: object
            properties:
              category:
                type: object
                properties:
                  Art:
                    type: object
                    properties:
                      Topics:
                        type: array
                        items:
                          type: string
                          example:
                            - Drawing
                            - Generative Art
                            - Portraits
                            - Comics
                            - Painting
                            - Illustration
                            - Fine Art
                            - Street Art
                            - Contemporary Art
                  "Artificial Intelligence":
                    type: object
                    properties:
                      Topics:
                        type: array
                        items:
                          type: string
                          example:
                            - Machine Learning
                            - ChatGPT
                            - Deep Learning
                            - Large Language Models
                            - NLP
                            - Voice Assistant
                            - Conversational AI
                  Arts:
                    type: object
                    properties:
                      Topics:
                        type: array
                        items:
                          type: string
                          example:
                            - Painting
                            - Design
                            - Dancing
                  Beauty:
                    type: object
                    properties:
                      Topics:
                        type: array
                        items:
                          type: string
                          example:
                            - Makeup
                            - Hair
                            - Skincare
                            - Beauty Tips
                            - Body Image
                  Blockchain:
                    type: object
                    properties:
                      Topics:
                        type: array
                        items:
                          type: string
                          example:
                            - Ethereum
                            - Decentralized Finance
                            - Web3
                            - Cryptocurrency
                            - Bitcoin
                            - Nft

      tags:
        - Topics
                   
  /user/activities/{username}:
    # Endpoint to get the activity log of a user
    get:
      operationId: UserService.getUserActivities
      responses:
        "200":
          description: A successful response.
          schema:
            type: object
            properties:
              response:
                type: array
                items:
                  type: object
                  properties:
                    timestamp:
                      type: string
                      format: date-time
                      example: "2024-06-26T17:39:52.472339Z"
                    description:
                      type: string
                      example: "logged in"
        default:
          description: An unexpected error response.
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 500
              message:
                type: string
                example: "Internal Server Error"
      parameters:
        - in: path
          name: username
          type: string
          required: true
          description: The username of the user whose activities are being retrieved
        - in: header
          name: Authorization
          type: string
          required: true
          description: Bearer token for authentication
      tags:
        - Get User Activity

  # ---------------------------------------------------------------------
  # Account verification (blue-check)
  #
  # Flow: 1) upload each document -> receive its sha256 `checksum`
  #       2) POST /user/verification referencing those checksums
  # Documents live in a PRIVATE bucket; the only way to view one is the
  # short-lived presigned URL endpoint (owner or platform admin).
  # ---------------------------------------------------------------------

  /v2/storage/verifications:
    post:
      tags:
        - Verification
      summary: Upload a verification document (step 1 of the blue-check flow)
      description: >
        Authenticated owner-scoped upload of ONE document into the private
        verification bucket. `kind` selects the slot: `selfie`,
        `id_front` or `id_back`. Accepts JPEG, PNG or WebP up to 10 MiB;
        HEIC/HEIF (default iPhone format) is rejected - convert first.
        The response `checksum` is what you send when submitting the
        verification request. Rate limit: none beyond global gateway limits.
      operationId: UserService.uploadVerificationAsset
      consumes:
        - multipart/form-data
      parameters:
        - in: header
          name: Authorization
          type: string
          required: true
          description: Bearer token for authorization
        - in: query
          name: kind
          type: string
          required: true
          enum:
            - selfie
            - id_front
            - id_back
        - in: formData
          name: file
          type: file
          required: true
          description: Image file (JPEG, PNG or WebP, max 10 MiB)
      responses:
        '201':
          description: Document stored. Echo `checksum` back in step 2.
          schema:
            type: object
            properties:
              kind: { type: string, example: selfie }
              checksum:
                type: string
                example: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
              bucket: { type: string }
              object: { type: string }
              etag: { type: string }
              size: { type: integer }
              contentType: { type: string, example: image/jpeg }
              blurhash: { type: string }
              width: { type: integer }
              height: { type: integer }
        '400':
          description: Missing file field or invalid `kind`.
        '401':
          description: Not authenticated.
        '413':
          description: File exceeds 10 MiB.
        '415':
          description: Unsupported media type (only JPEG/PNG/WebP accepted).
        default:
          description: An unexpected error response.

  /v2/storage/verifications/{request_id}/{kind}/url:
    get:
      tags:
        - Verification
      summary: Get a short-lived URL to view one submitted document
      description: >
        Returns a presigned GET URL (valid 10 minutes) into the private
        bucket. Accessible ONLY to the request owner or an admin JWT role.
      operationId: UserService.getVerificationAssetURL
      parameters:
        - in: header
          name: Authorization
          type: string
          required: true
          description: Bearer token for authorization
        - in: path
          name: request_id
          type: string
          required: true
          description: Verification request id (from submit/get responses)
        - in: path
          name: kind
          type: string
          required: true
          enum: [selfie, id_front, id_back]
      responses:
        '200':
          description: Presigned URL issued.
          schema:
            type: object
            properties:
              url: { type: string }
              expires_in_seconds: { type: integer, example: 600 }
        '403':
          description: Caller is neither the owner nor an admin.
        '404':
          description: Request not found, or that `kind` was not uploaded.
        default:
          description: An unexpected error response.

  /user/verification:
    post:
      tags:
        - Verification
      summary: Submit a verification request (step 2 of the flow)
      description: >
        Creates a `pending` request. One active request per account -
        duplicates get 409. For `id_document` requests the server enforces
        country-specific document rules (~40 launch regions; unknown
        countries accept passport/residence_permit only), requires
        `selfie_checksum` + `id_front_checksum` (`id_back_checksum`
        recommended where the ID has a reverse side), and verifies every
        checksum exists from step 1 uploads. Rate limited to 10/hour.
      operationId: UserService.submitVerification
      parameters:
        - in: header
          name: Authorization
          type: string
          required: true
          description: Bearer token for authorization
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - verification_type
            properties:
              verification_type:
                type: string
                enum: [social_proof, id_document]
                example: id_document
              country:
                type: string
                description: ISO 3166-1 alpha-2, required for id_document requests
                example: IN
              id_document_type:
                type: string
                enum: [passport, national_id, drivers_license, residence_permit]
                example: passport
              selfie_checksum:
                type: string
                description: 64-char sha256 from step 1 (required for id_document)
              id_front_checksum:
                type: string
                description: Required for id_document
              id_back_checksum:
                type: string
                description: Optional (send when the ID has a reverse side)
              additional_info:
                type: string
                maxLength: 2000
                description: Free-text context for reviewers (e.g. social links for social_proof)
      responses:
        '201':
          description: Request created with status `pending`.
          schema:
            $ref: '#/definitions/VerificationRequest'
        '400':
          description: Validation failure (bad type/country/doc combo, unknown checksum, oversized info).
        '401':
          description: Not authenticated.
        '409':
          description: An active request already exists.
        default:
          description: An unexpected error response.

  /user/verification/me:
    get:
      tags:
        - Verification
      summary: Get my latest verification request and its state
      operationId: UserService.getMyVerification
      parameters:
        - in: header
          name: Authorization
          type: string
          required: true
          description: Bearer token for authorization
      responses:
        '200':
          description: >
            Latest request, or `{ "status": "none" }` when the caller has
            never submitted one.
          schema:
            oneOf:
              - $ref: '#/definitions/VerificationRequest'
              - type: object
                properties:
                  status: { type: string, example: none }
                  message: { type: string }
        '401':
          description: Not authenticated.
        default:
          description: An unexpected error response.

  /user/verification/{request_id}:
    delete:
      tags:
        - Verification
      summary: Cancel my PENDING verification request
      description: >
        Only requests still in `pending` can be cancelled; anything under
        review or decided is permanent history. Ownership enforced
        server-side.
      operationId: UserService.cancelVerification
      parameters:
        - in: header
          name: Authorization
          type: string
          required: true
          description: Bearer token for authorization
        - in: path
          name: request_id
          type: string
          required: true
      responses:
        '200':
          description: Cancelled.
          schema:
            type: object
            properties:
              message: { type: string, example: verification request cancelled }
        '404':
          description: No pending request with that id for this account.
        default:
          description: An unexpected error response.

definitions:
  VerificationRequest:
    type: object
    properties:
      id: { type: string }
      username: { type: string }
      verification_type:
        type: string
        enum: [social_proof, id_document]
      country:
        type: string
        description: Present on id_document requests
        example: IN
      id_document_type:
        type: string
        enum: [passport, national_id, drivers_license, residence_permit]
      status:
        type: string
        enum: [pending, under_review, approved, rejected]
        description: Lifecycle is pending -> under_review -> approved|rejected.
      selfie_checksum: { type: string }
      id_front_checksum: { type: string }
      id_back_checksum: { type: string }
      additional_info: { type: string }
      reviewer_username: { type: string }
      rejection_reason:
        type: string
        description: Set when status is rejected
      created_at: { type: string, format: date-time }
      updated_at: { type: string, format: date-time }
      reviewed_at: { type: string, format: date-time }

