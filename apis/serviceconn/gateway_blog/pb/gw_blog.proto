syntax = "proto3";

package blog_svc;

import "google/protobuf/any.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "./apis/serviceconn/gateway_blog/pb";

// Global enums for activity tracking (matching auth service)
enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_WEB = 1;
  PLATFORM_MOBILE = 2;
  PLATFORM_TABLET = 3;
  PLATFORM_API = 4;
  PLATFORM_DESKTOP = 5;
}

// Reusable client information for all requests (matching auth service)
message ClientInfo {
  // Basic client information
  string ip_address = 1;
  string client = 2;
  string session_id = 3;
  string user_agent = 4;
  string referrer = 5;
  Platform platform = 6;

  // Enhanced Browser fingerprinting
  string accept_language = 7;
  string accept_encoding = 8;
  string dnt = 9;
  string timezone = 10;
  string screen_resolution = 11;
  string color_depth = 12;
  string device_memory = 13;
  repeated string languages = 14;

  // Location & Geographic hints
  string country = 15;
  string timezone_offset = 16;

  // Marketing & UTM tracking
  string utm_source = 17;
  string utm_medium = 18;
  string utm_campaign = 19;
  string utm_content = 20;
  string utm_term = 21;

  // Behavioral indicators
  bool is_bot = 22;
  double trust_score = 23;
  int32 request_count = 24;

  // Technical environment
  bool is_secure_context = 25;
  string connection_type = 26;
  string browser_engine = 27;
  bool javascript_enabled = 28;

  // Timestamps
  string first_seen = 29;
  string last_seen = 30;
  string collected_at = 31;
  
  string origin = 32;
  string real_ip = 33;
  string browser = 34;
  string accept = 35;
  string connection = 36;
  string device_type = 37;
  string os = 38;
  string forwarded_for = 39;
  string forwarded_proto = 40;
  string forwarded_host = 41; 
  string forwarded_port = 42;
  string visitor_id = 43;
  int64 duration_ms = 44;
}

message DraftBlogRequest {
    string blog_id = 1;
    string owner_account_id = 2;
    Blog blog = 3;
    bool is_draft = 4;
    bool is_archive = 5;
    repeated string tags = 6;
    string content_type = 7;
    repeated string author_list = 8;
    string ip = 9;
    string client = 10;
    string action = 11;
    
    // Enhanced client tracking fields (backward compatible)
    string session_id = 12;
    string user_agent = 13;
    string referrer = 14;
    Platform platform = 15;
    
    // Comprehensive client information
    ClientInfo client_info = 16;
}

message BlogResponse {
    string message = 1;
    Blog blog = 2;
    string error = 3;
}

message Blog {
    int64 time = 1;
    repeated Block blocks = 2;
}

message Block {
    string id = 1;
    string type = 2;
    Data data = 3;
    repeated string author = 4;
    int64 time = 5;
    Tunes tunes = 6;
}

message Data {
    string text = 1;
    int32 level = 2; // For headers
    File file = 3; // For files in attaches and images
    repeated string items = 4; // For lists and checklist items
    string list_type = 5; // For list type (unordered, ordered)
    bool withBorder = 6; // For images
    bool withBackground = 7; // For images
    bool stretched = 8; // For images
    string caption = 9; // For images

    // For tables
    bool withHeadings = 10; // For tables
    repeated TableRow table_content = 11;

    // For code blocks
    string code = 12;
    string language = 13; // Optional: language of the code block

    // For URLs
    URLData link = 14;

    // For checklists
    repeated ChecklistItem checklist = 15;
}

message TableRow {
    repeated string cells = 1; // List of cell contents in the row
}

message ChecklistItem {
    string text = 1;
    bool checked = 2;
}

message URLData {
    string url = 1;
    string title = 2;
    string description = 3;
    string image_url = 4; // Optional: Image URL for link previews
}

message File {
    string url = 1;
    int32 size = 2;
    string name = 3;
    string extension = 4;
}

message Tunes {
    repeated string footnotes = 1;
}

message PublishBlogReq {
    string blog_id = 1;
    string account_id = 2;
    string ip = 3;
    string client = 4;
    repeated string tags = 5;
    string slug = 6;
    
    // Enhanced client tracking fields (backward compatible)
    string session_id = 7;
    string user_agent = 8;
    string referrer = 9;
    Platform platform = 10;
    
    // Comprehensive client information
    ClientInfo client_info = 11;
}

message ScheduleBlogReq {
    PublishBlogReq publish = 1;
    google.protobuf.Timestamp schedule_time = 2;
    string timezone = 3;
}

message PublishBlogResp {
    string message = 1;
    string error = 2;
}

message ScheduleBlogResp {
     string message = 1;
     string error = 2;
}

message BlogByIdReq {
    string blog_id = 1;
    string owner_account_id = 2;
    ClientInfo client_info = 3;
}

message BlogByIdRes {
    string blog_id = 1;
    string owner_account_id = 2;
    Blog blog = 3;
    bool is_draft = 4;
    bool is_archive = 5;
    repeated string tags = 6;
    string content_type = 7;
    repeated string author_list = 8;
}

message ArchiveBlogReq {
    string blog_id = 1;
    ClientInfo client_info = 2;
}

message ArchiveBlogResp {
    string message = 1;
    string error = 2;
}

message GetBlogsByTagsNameReq {
    repeated string tag_names = 1;
    ClientInfo client_info = 2;
}

message GetBlogsByTags {
    string blog_id = 1;
    string owner_account_id = 2;
    Blog blog = 3;
    repeated string tags = 4;
    string content_type = 5;
    repeated string author_list = 6;
}

message GetBlogsByTagsNameRes {
    repeated GetBlogsByTags the_blogs = 1;
    string error = 2;
}

message GetBlogs {
    string blog_id = 1;
    string owner_account_id = 2;
    Blog blog = 3;
    repeated string tags = 4;
    string content_type = 5;
    repeated string author_list = 6;

      // Scheduling metadata
    bool is_scheduled = 7;
    bool is_draft = 8;
    string schedule_time = 9; // RFC3339 UTC
    string timezone = 10;
}

message GetDraftBlogsRes {
    repeated GetBlogs blogs = 1;
    string error = 2;
}

message GetPublishedBlogsRes {
    repeated GetBlogs blogs = 1;
    string error = 2;
}

message GetScheduledBlogRes {
    repeated GetBlogs blogs = 1;
    string error = 2;
}

message BlogExistsRes {
    bool blog_exists = 1;
    bool is_draft = 2;
    bool is_archive = 3;
    repeated string tags = 4;
    string last_publish_time = 5;
    string error = 6;
}

message DeleteBlogReq {
    string blog_id = 1;
    string owner_account_id = 2;
    string ip = 3;
    string client = 4;
    
    // Enhanced client tracking fields (backward compatible)
    string session_id = 5;
    string user_agent = 6;
    string referrer = 7;
    Platform platform = 8;
    
    // Comprehensive client information
    ClientInfo client_info = 9;
}

message DeleteBlogResp {
    string message = 1;
    string error = 2;
}

message GetBlogsByBlogIds {
    repeated string blog_ids = 1;
}

message GetBlogsRes {
    repeated GetBlogs blogs = 1;
    string error = 2;
}

// --------------------------------------------------------------------- V2 APIs ---------------------------------------------------------------------

message FollowingAccounts {
    repeated string account_ids = 1;
    int32 limit = 2;
    int32 offset = 3;
    string sort_by = 4;
}

message GetBlogsReq {
    string account_id = 1;
    string username = 2;
    bool is_draft = 3;
    bool is_archive = 4;
    repeated string tags = 5;
    int32 limit = 6;
    int32 offset = 7;
    string sort_by = 8;
    
    // Enhanced client tracking fields (backward compatible)
    string ip = 9;
    string client = 10;
    string session_id = 11;
    string user_agent = 12;
    string referrer = 13;
    Platform platform = 14;
    
    // Comprehensive client information
    ClientInfo client_info = 15;
}

message GetBlogsBySliceReq {
    repeated string blog_ids = 1;
    repeated string owner_account_ids = 2;
    repeated string tags = 3;
    repeated string usernames = 4;
    int32 limit = 5;
    int32 offset = 6;
    bool is_draft = 7;
    bool is_archive = 8;
    ClientInfo client_info = 9;
}

message BlogReq {
    string blog_id = 1;
    string account_id = 2;
    string ip = 3;
    string client = 4;
    string username = 5;
    bool is_draft = 6;
    bool is_archive = 7;
    
    // Enhanced client tracking fields (backward compatible)
    string session_id = 8;
    string user_agent = 9;
    string referrer = 10;
    Platform platform = 11;
    ClientInfo client_info = 12;
    int64 duration_ms = 13;
}


message BlogResp {
    string message = 1;
    string error = 2;
}

message BlogListReq {
    repeated string tags = 1;
    int32 limit = 2;
    int32 offset = 3;
    string accountId = 4; // Optional: filter by account ID
    bool isDraft = 5; // Optional: filter by draft status

    repeated string blog_ids = 6; // Optional: filter by specific blog IDs
    
    // Enhanced client tracking fields (backward compatible)
    string ip = 7;
    string client = 8;
    string session_id = 9;
    string user_agent = 10;
    string referrer = 11;
    Platform platform = 12;
    ClientInfo client_info = 13;
    bool is_scheduled = 14;
}

message SearchReq {
    string query = 1; // Search query
    int32 limit = 2; // Number of results to return
    int32 offset = 3; // Offset for pagination
    repeated string tags = 4; // Optional tags to filter results
    
    // Enhanced client tracking fields (backward compatible)
    string ip = 5;
    string client = 6;
    string session_id = 7;
    string user_agent = 8;
    string referrer = 9;
    Platform platform = 10;
    ClientInfo client_info = 11;
}

message GetScheduleBlogsByAccountIdReq {
    // Account ID to filter blogs (if empty, returns all - only for admin)
    string account_id = 1;
    // Enhanced client tracking fields
    ClientInfo client_info = 2;
}




message MoveScheduleBlogToDraftResp {
    string message = 1;
    string error = 2;
}

service BlogService {
    // Metadata may contain the blog id, owner account id, title, first paragraph, 
    // tags, first image, publish time, author name, etc.
    rpc GetBlogsMetadata(BlogListReq) returns (stream google.protobuf.Any);
    rpc SearchBlogsMetadata(SearchReq) returns (stream google.protobuf.Any);
    rpc PublishBlog(PublishBlogReq) returns (PublishBlogResp); // By blog id\
    rpc ScheduleBlog(ScheduleBlogReq) returns (ScheduleBlogResp); 
    
    // --------------------------------------------------------------------- Deprecated APIs ---------------------------------------------------------------------
    // TODO: Remove the deprecated APIs
    rpc DraftBlog(DraftBlogRequest) returns (BlogResponse); // Migrated to DraftBlogV2
    rpc GetPublishedBlogById(BlogByIdReq) returns (BlogByIdRes); // One blog by blog id
    rpc GetDraftBlogById(BlogByIdReq) returns (BlogByIdRes); // One blog by blog id
    rpc ArchiveBlogById(ArchiveBlogReq) returns (ArchiveBlogResp); // One blog by blog id
    rpc GetPublishedBlogsByTagsName(GetBlogsByTagsNameReq) returns (GetBlogsByTagsNameRes);
    rpc GetDraftBlogsByAccId(BlogByIdReq) returns (GetDraftBlogsRes);
    rpc GetPublishedBlogsByAccID(BlogByIdReq) returns (GetPublishedBlogsRes);
    rpc GetLatest100Blogs(GetBlogsByTagsNameReq) returns (GetBlogsByTagsNameRes);
    rpc GetPublishedBlogByIdAndOwnerId(BlogByIdReq) returns (BlogByIdRes);

    rpc GetAllBlogsByBlogIds(GetBlogsByBlogIds) returns (GetBlogsRes) {};

    rpc CheckIfBlogsExist(BlogByIdReq) returns (BlogExistsRes);
    rpc DeleteABlogByBlogId(DeleteBlogReq) returns (DeleteBlogResp);

    // rpc DraftBlogV2(DraftBlogV2Req) returns (BlogV2Response);

    // Corrected APIS
    rpc GetDraftBlogByBlogId(BlogByIdReq) returns (BlogByIdRes);


  // --------------------------------------------------------------------- V2 APIs ---------------------------------------------------------------------
    rpc DraftBlogV2(stream google.protobuf.Any) returns (stream google.protobuf.Any);
    rpc BlogsOfFollowingAccounts(FollowingAccounts) returns (stream google.protobuf.Any);
    rpc GetBlogs(GetBlogsReq) returns (stream google.protobuf.Any);
    rpc GetBlog(BlogReq) returns (google.protobuf.Any); // By blog id
    rpc MoveBlogToDraftStatus(BlogReq) returns (BlogResp); // By from published status to draft status by blog id
    rpc GetBlogsBySlice(GetBlogsBySliceReq) returns (stream google.protobuf.Any);
    rpc MetaGetFeedBlogs(BlogListReq) returns (stream google.protobuf.Any);
    rpc MetaGetUsersBlogs(BlogListReq) returns (stream google.protobuf.Any);
    rpc MetaGetBlogsByBlogIds(BlogListReq) returns (stream google.protobuf.Any);
    rpc UsersBlogData(BlogReq) returns (google.protobuf.Any);
    // Track user interaction with a blog (e.g. read duration)
    rpc TrackInteraction(TrackInteractionReq) returns (TrackInteractionResp);

    rpc AdminListESBlogIds(AdminListESBlogIdsReq) returns (AdminListESBlogIdsResp);
}

message TrackInteractionReq {
    string blog_id = 1;
    string account_id = 2;
    string interaction_type = 3; // e.g. "read_duration", "like", "share", "follow_topics", "follow_account"
    int64 duration_ms = 4;
    ClientInfo client_info = 5;
    google.protobuf.Struct metadata = 6;
}

message TrackInteractionResp {
    bool success = 1;
    string message = 2;
}

message AdminListESBlogIdsReq {
    int32 limit = 1;
    int32 offset = 2;
}

message AdminListESBlogIdsResp {
    repeated string blog_ids = 1;
    int32 total = 2;
}
